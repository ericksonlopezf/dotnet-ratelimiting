name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  compliance-and-build:
    name: Compliance, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Setup .NET 8 & 9 Runtimes
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Run Architecture & Rules Compliance Script
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Verify Code Style & Formatting
        run: dotnet format --verify-no-changes

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install SonarScanner tool
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.RateLimiting.slnx

      - name: Begin Sonar Analysis
        id: sonar_begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin \
            /k:"ericksonlopezf_dotnet-ratelimiting" \
            /o:"ericksonlopezf" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="./test-results/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="tests/**,samples/**,benchmarks/**,scripts/**,**/*Tests.cs,**/*Test*.cs,**/bin/**,**/obj/**" \
            /d:sonar.cpd.exclusions="tests/**,samples/**,benchmarks/**,scripts/**,**/*Tests.cs,**/*Test*.cs,**/bin/**,**/obj/**"

      - name: Build Solution (Release with Strict Diagnostics)
        run: dotnet build EricksonLopez.RateLimiting.slnx --no-restore --configuration Release

      - name: Run All Test Suites
        run: >
          dotnet test EricksonLopez.RateLimiting.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && steps.sonar_begin.conclusion == 'success' && env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ericksonlopezf/dotnet-ratelimiting
          files: "./test-results/**/coverage.cobertura.xml,./test-results/**/coverage.opencover.xml"
          fail_ci_if_error: false

      - name: Validate NuGet Packaging
        run: dotnet pack EricksonLopez.RateLimiting.slnx --no-build --configuration Release -o artifacts/

      - name: Validate Package Integrity
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts/*.nupkg
          if ($packages.Count -ne 3) {
            Write-Error "Expected exactly 3 packages, found $($packages.Count)"
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "Verifying package: $($pkg.Name)"
            # Unzip package to temp folder to verify contents
            $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
            Expand-Archive -Path $pkg.FullName -DestinationPath $tempDir
            if (-not (Test-Path (Join-Path $tempDir "README.md"))) {
              Write-Error "Package $($pkg.Name) is missing packaged README.md"
              exit 1
            }
            if (-not (Test-Path (Join-Path $tempDir "icon.png"))) {
              Write-Error "Package $($pkg.Name) is missing packaged icon.png"
              exit 1
            }
            Remove-Item -Recurse -Force $tempDir
          }
          Write-Host "✅ All packages verified with README and icon.png intact."
