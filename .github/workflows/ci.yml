name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  compliance-and-build:
    name: Compliance, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Setup .NET 8 & 9 Runtimes
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Run Architecture & Rules Compliance Script
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Verify Code Style & Formatting
        run: dotnet format --verify-no-changes

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.RateLimiting.slnx

      - name: Build Solution (Release with Strict Diagnostics)
        run: dotnet build EricksonLopez.RateLimiting.slnx --no-restore --configuration Release

      - name: Run All Test Suites
        run: dotnet test EricksonLopez.RateLimiting.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          fail_ci_if_error: false
          slug: ericksonlopezf/dotnet-ratelimiting

      - name: Validate NuGet Packaging
        run: dotnet pack EricksonLopez.RateLimiting.slnx --no-build --configuration Release -o artifacts/

      - name: Validate Package Integrity
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts/*.nupkg
          if ($packages.Count -ne 3) {
            Write-Error "Expected exactly 3 packages, found $($packages.Count)"
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "Verifying package: $($pkg.Name)"
            # Unzip package to temp folder to verify contents
            $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ([System.Guid]::NewGuid().ToString())
            Expand-Archive -Path $pkg.FullName -DestinationPath $tempDir
            if (-not (Test-Path (Join-Path $tempDir "README.md"))) {
              Write-Error "Package $($pkg.Name) is missing packaged README.md"
              exit 1
            }
            if (-not (Test-Path (Join-Path $tempDir "icon.png"))) {
              Write-Error "Package $($pkg.Name) is missing packaged icon.png"
              exit 1
            }
            Remove-Item -Recurse -Force $tempDir
          }
          Write-Host "✅ All packages verified with README and icon.png intact."
